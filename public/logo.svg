<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="16" fill="#111111"/>
  
  <!-- Repeat icon: two curved arrows forming a loop -->
  <!-- Top arrow: left to right -->
  <path 
    d="M14 24 C14 18 19 14 25 14 L42 14" 
    stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"
  />
  <!-- Arrowhead top-right -->
  <polyline 
    points="36,8.5 42,14 36,19.5" 
    stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />
  
  <!-- Bottom arrow: right to left -->
  <path 
    d="M50 40 C50 46 45 50 39 50 L22 50" 
    stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"
  />
  <!-- Arrowhead bottom-left -->
  <polyline 
    points="28,55.5 22,50 28,44.5" 
    stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />
  
  <!-- Vertical connectors -->
  <line x1="14" y1="24" x2="14" y2="40" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="24" x2="50" y2="40" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
</svg>
