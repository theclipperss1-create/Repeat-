server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        
        # Support clean URLs by checking for file, then file.html, then directory
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Custom 404 handler
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}
